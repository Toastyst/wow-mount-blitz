<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoW Mount Blitz Guide • High-Volume Single Session | Midnight 2026</title>
<style>
  :root {
    --bg: #0b0d17;
    --bg-card: #13162a;
    --bg-elevated: #1a1e35;
    --border: #2a2f4a;
    --text: #e8eaf6;
    --text-muted: #a0a5c0;
    --gold: #f0c14b;
    --gold-dim: #c9a227;
    --purple: #8b5cf6;
    --green: #34d399;
    --blue: #60a5fa;
    --radius: 12px;
    --shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(240, 193, 75, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 0 1.25rem 4rem; }
  header { text-align: center; padding: 3.5rem 1rem 2.5rem; }
  header h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), #fff, var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }
  header .tagline { font-size: 1.15rem; color: var(--text-muted); max-width: 540px; margin: 0 auto 1.5rem; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .badge {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .badge.gold { border-color: var(--gold-dim); color: var(--gold); }
  .badge.green { border-color: var(--green); color: var(--green); }
  section { margin-bottom: 2.75rem; }
  h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.1rem; display: flex; align-items: center; gap: 0.6rem; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.35rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .addon-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
  }
  .addon-card h3 { font-size: 1rem; color: var(--gold); margin-bottom: 0.35rem; }
  .addon-card p { font-size: 0.88rem; color: var(--text-muted); }
  .checklist { list-style: none; }
  .checklist li {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid rgba(42,47,74,0.5);
  }
  .checklist li:last-child { border-bottom: none; }
  .check {
    width: 1.25rem; height: 1.25rem;
    border: 2px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 0.15rem;
    background: var(--bg);
  }
  .timeline { position: relative; padding-left: 1.5rem; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0.45rem; top: 0.5rem; bottom: 0.5rem;
    width: 2px;
    background: linear-gradient(to bottom, var(--purple), var(--gold));
    border-radius: 2px;
  }
  .step { position: relative; margin-bottom: 1.5rem; }
  .step::before {
    content: '';
    position: absolute;
    left: -1.35rem; top: 0.55rem;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--purple);
    z-index: 1;
  }
  .step.guaranteed::before { border-color: var(--green); background: var(--green); }
  .step-header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .step-num { font-weight: 700; color: var(--gold); font-size: 0.95rem; }
  .step-title { font-weight: 650; font-size: 1.05rem; }
  .time {
    font-size: 0.8rem;
    background: var(--bg-elevated);
    padding: 0.15rem 0.55rem;
    border-radius: 6px;
    color: var(--text-muted);
  }
  .tag {
    font-size: 0.72rem; font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag.guaranteed { background: rgba(52, 211, 153, 0.15); color: var(--green); }
  .tag.chance { background: rgba(240, 193, 75, 0.12); color: var(--gold); }
  .tag.midnight { background: rgba(139, 92, 246, 0.15); color: var(--purple); }
  .mounts { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .mount {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.25rem 0.65rem;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .mount strong { color: var(--gold); }
</style>
</head>
